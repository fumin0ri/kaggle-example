model: mlp
target: Transported
seed: 42
feature_set: basic
threshold: 0.5
memo: Small neural-network diversity baseline
cv:
  strategy: stratified_group
  n_splits: 5
  fold_path: artifacts/folds_group_5_seed42.csv
params:
  hidden_layer_sizes: [64, 32]
  activation: relu
  alpha: 0.001
  batch_size: 128
  learning_rate_init: 0.001
  validation_fraction: 0.15
  n_iter_no_change: 20
  max_iter: 180
