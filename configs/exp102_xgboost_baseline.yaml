model: xgboost
target: Transported
seed: 42
feature_set: basic
threshold: 0.5
memo: XGBoost one-hot diverse baseline
cv:
  strategy: stratified_group
  n_splits: 5
  fold_path: artifacts/folds_group_5_seed42.csv
params:
  n_estimators: 550
  learning_rate: 0.04
  max_depth: 5
  min_child_weight: 4
  subsample: 0.85
  colsample_bytree: 0.8
  reg_alpha: 0.05
  reg_lambda: 2.5
  tree_method: hist
