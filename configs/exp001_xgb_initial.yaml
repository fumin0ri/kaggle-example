model: xgboost
target: Transported
seed: 42
feature_set: raw
threshold: 0.5
memo: Initial XGBoost baseline with ordinary StratifiedKFold
cv:
  strategy: stratified
  n_splits: 5
  fold_path: artifacts/folds_stratified_5_seed42.csv
params:
  n_estimators: 500
  learning_rate: 0.04
  max_depth: 5
  min_child_weight: 3
  subsample: 0.85
  colsample_bytree: 0.85
  reg_lambda: 2.0
  tree_method: hist
